<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billboard Slideshow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #slide-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      transition: background-color 0.5s ease;
    }
    #slide-text {
      line-height: 1.2;
      word-wrap: break-word;
      max-width: 90vw;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 0.3em;
      transition: opacity 0.3s ease;
    }

    /* Word Styling */
    .word {
      display: inline-block;
      transition: color 0.3s ease, font-size 0.3s ease;
    }
    
    /* Optional Animations */
    .bounce { animation: bounce 0.8s infinite alternate; }
    .glow { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
    
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-15px); }
    }

    /* Subtle UI Buttons */
    .top-btn {
      position: fixed;
      top: 15px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .top-btn:hover {
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      border-color: #ffffff;
    }
    #add-btn {
      left: 15px;
      width: 36px;
      height: 36px;
      font-size: 22px;
      line-height: 30px;
      text-align: center;
    }
    #fullscreen-btn {
      right: 15px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
    }

    /* Modal Form Overlay */
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #1e1e1e;
      color: #ffffff;
      padding: 24px;
      border-radius: 10px;
      width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .modal-box h3 { margin-bottom: 16px; font-size: 18px; text-align: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #aaa; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
    }

    /* Words Builder UI */
    #words-builder {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .word-row {
      display: flex;
      gap: 6px;
      align-items: center;
      background: #282828;
      padding: 6px;
      border-radius: 4px;
    }
    .word-row input[type="text"] { flex: 2; }
    .word-row input[type="color"] { width: 35px; height: 35px; padding: 0; cursor: pointer; }
    .word-row input[type="number"] { width: 60px; }
    .word-row select { flex: 1; }
    .btn-remove {
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add-word {
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .modal-buttons { display: flex; gap: 10px; margin-top: 18px; }
    .modal-buttons button {
      flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .btn-save { background: #28a745; color: #fff; }
    .btn-cancel { background: #dc3545; color: #fff; }
  </style>

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <button id="add-btn" class="top-btn" onclick="openModal()">+</button>
  <button id="fullscreen-btn" class="top-btn" onclick="toggleFullscreen()">Fullscreen</button>

  <div id="slide-container">
    <div id="slide-text">Loading Firebase...</div>
  </div>

  <!-- Add Slide Modal -->
  <div id="modal-overlay">
    <div class="modal-box">
      <h3>Add Custom Word Slide</h3>

      <div class="form-group">
        <label>Slide Duration (Seconds)</label>
        <input type="number" id="input-duration" value="5" min="1">
      </div>

      <div class="form-group">
        <label>Background Color</label>
        <input type="color" id="input-bg" value="#004d98">
      </div>

      <div class="form-group">
        <label>Customize Words</label>
        <div id="words-builder"></div>
        <button type="button" class="btn-add-word" onclick="addWordRow()">+ Add Another Word</button>
      </div>

      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveSlide()">Save Slide</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAjeXycCBhYoAU-0iiC4LbSTylKrrThN8Y",
      authDomain: "sharplabubu.firebaseapp.com",
      databaseURL: "https://sharplabubu-default-rtdb.firebaseio.com",
      projectId: "sharplabubu",
      storageBucket: "sharplabubu.firebasestorage.app",
      messagingSenderId: "596148393481",
      appId: "1:596148393481:web:4f822d86c44a13bd810ad8",
      measurementId: "G-4M25R3BF08"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let slides = [];
    let currentIndex = 0;
    let slideTimer = null;

    const container = document.getElementById('slide-container');
    const textElement = document.getElementById('slide-text');

    // Realtime Database Listener
    db.ref('slides').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        slides = Array.isArray(data) ? data : Object.values(data);
        currentIndex = 0;
        showSlide();
      } else {
        slides = [];
        textElement.innerHTML = "No slides added yet. Click + to add one.";
        container.style.backgroundColor = "#000000";
        textElement.style.color = "#ffffff";
      }
    });

    function showSlide() {
      if (slideTimer) clearTimeout(slideTimer);
      if (!slides || slides.length === 0) return;

      const currentSlide = slides[currentIndex];
      textElement.style.opacity = 0;

      setTimeout(() => {
        container.style.backgroundColor = currentSlide.backgroundColor || '#000000';
        textElement.innerHTML = '';

        // Check if slide uses individual words array or legacy full text
        if (currentSlide.words && Array.isArray(currentSlide.words)) {
          currentSlide.words.forEach(w => {
            const span = document.createElement('span');
            span.className = `word ${w.animation || ''}`;
            span.textContent = w.text;
            span.style.color = w.color || '#ffffff';
            span.style.fontSize = (w.size || 6) + 'rem';
            span.style.fontWeight = w.bold ? 'bold' : 'normal';
            span.style.fontStyle = w.italic ? 'italic' : 'normal';
            textElement.appendChild(span);
          });
        } else {
          // Fallback for simple text slides
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = currentSlide.text || '';
          span.style.color = currentSlide.textColor || '#ffffff';
          span.style.fontSize = currentSlide.fontSize || '6rem';
          textElement.appendChild(span);
        }

        textElement.style.opacity = 1;
      }, 300);

      const duration = (currentSlide.duration || 5) * 1000;

      slideTimer = setTimeout(() => {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide();
      }, duration);
    }

    // Modal & Word Builder Control Functions
    function openModal() {
      document.getElementById('words-builder').innerHTML = '';
      // Pre-populate with 2 default word rows
      addWordRow('Welcome to', '#edbb00', 6);
      addWordRow('Barcelona', '#ffffff', 8);
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    function addWordRow(text = '', color = '#ffffff', size = 6) {
      const builder = document.getElementById('words-builder');
      const row = document.createElement('div');
      row.className = 'word-row';
      row.innerHTML = `
        <input type="text" class="w-text" placeholder="Word" value="${text}">
        <input type="color" class="w-color" value="${color}">
        <input type="number" class="w-size" value="${size}" title="Font Size (rem)">
        <select class="w-anim" title="Animation">
          <option value="">Static</option>
          <option value="bounce">Bounce</option>
          <option value="glow">Glow Effect</option>
        </select>
        <button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button>
      `;
      builder.appendChild(row);
    }

    function saveSlide() {
      const duration = parseInt(document.getElementById('input-duration').value) || 5;
      const backgroundColor = document.getElementById('input-bg').value;
      const rows = document.querySelectorAll('.word-row');

      const words = [];
      rows.forEach(row => {
        const text = row.querySelector('.w-text').value.trim();
        if (text) {
          words.push({
            text: text,
            color: row.querySelector('.w-color').value,
            size: parseFloat(row.querySelector('.w-size').value) || 6,
            animation: row.querySelector('.w-anim').value
          });
        }
      });

      if (words.length === 0) {
        alert("Please add at least one word!");
        return;
      }

      const newSlide = { duration, backgroundColor, words };

      slides.push(newSlide);
      db.ref('slides').set(slides).then(() => {
        closeModal();
      }).catch(err => {
        alert("Error saving slide: " + err.message);
      });
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
