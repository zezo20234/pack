<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Billboard System - Multi-Screen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Arial Black', Impact, sans-serif; background-color: #000;
    }
    
    /* Main Screen Display */
    #slide-container {
      width: 100vw; height: 100vh; display: flex; align-items: center;
      justify-content: center; text-align: center; padding: 40px;
      transition: background-color 0.8s ease; position: relative;
    }
    #slide-text {
      line-height: 1.2; word-wrap: break-word; max-width: 90vw;
      display: flex; flex-wrap: wrap; justify-content: center;
      align-items: baseline; gap: 0.3em; z-index: 2;
    }

    /* Word Animations */
    .word { display: inline-block; transition: color 0.3s ease, font-size 0.3s ease; }
    .bounce { animation: bounce 0.8s infinite alternate ease-in-out; }
    .glow { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
    .pulse { animation: pulse 1.2s infinite alternate ease-in-out; }
    .rainbow { animation: rainbow 3s linear infinite; }
    .wave { animation: wave 1.5s infinite ease-in-out; }

    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.15); } }
    @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px) rotate(3deg); } }
    @keyframes rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

    /* Transitions */
    .trans-fade { opacity: 0; transition: opacity 0.6s ease; }
    .trans-fade.active { opacity: 1; }
    .trans-slide { opacity: 0; transform: translateY(50px); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .trans-slide.active { opacity: 1; transform: translateY(0); }
    .trans-zoom { opacity: 0; transform: scale(0.5); transition: all 0.6s ease; }
    .trans-zoom.active { opacity: 1; transform: scale(1); }

    /* Floating Controls UI */
    .controls-panel {
      position: fixed; top: 20px; left: 20px; z-index: 9999;
      display: flex; gap: 12px; opacity: 0.3; transition: opacity 0.3s;
    }
    .controls-panel:hover { opacity: 1; }
    
    .ctrl-btn {
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%;
      width: 45px; height: 45px; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .ctrl-btn:hover { background: #007bff; border-color: #007bff; transform: scale(1.1); }
    
    .top-right-panel {
      position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 9999; opacity: 0.3; transition: opacity 0.3s;
    }
    .top-right-panel:hover { opacity: 1; }
    .screen-badge {
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px;
      padding: 0 15px; font-size: 14px; font-family: Arial, sans-serif; font-weight: bold;
      display: flex; align-items: center; justify-content: center; text-transform: uppercase;
    }
    #fullscreen-btn { border-radius: 8px; width: auto; padding: 0 15px; font-size: 14px; font-family: Arial, sans-serif; }

    /* Progress & Indicators UI */
    #progress-container { position: fixed; bottom: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.3); z-index: 10; }
    #progress-bar { height: 100%; width: 0%; background: #ffffff; transition: width linear; }
    #indicators { position: fixed; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 10; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: 0.3s; }
    .dot.active { background: #ffffff; transform: scale(1.3); }

    /* Modals (Glassmorphism style) */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
      z-index: 10000; align-items: center; justify-content: center; font-family: Arial, sans-serif;
    }
    .modal-box {
      background: rgba(30, 30, 30, 0.85); color: #ffffff; padding: 25px; border-radius: 15px;
      width: 550px; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-box h3 { margin-bottom: 20px; font-size: 22px; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; }
    .modal-box p.subtitle { text-align: center; color: #aaa; margin-bottom: 20px; font-size: 14px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #ccc; font-weight: bold; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #555;
      background: rgba(0,0,0,0.4); color: #fff; font-size: 14px;
    }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }

    /* Word Builder */
    #words-builder { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
    .word-row { display: flex; gap: 6px; align-items: center; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; }
    .word-row input[type="text"] { flex: 2; }
    .word-row input[type="color"] { width: 40px; height: 40px; padding: 0; cursor: pointer; border: none; border-radius: 4px; }
    .word-row input[type="number"] { width: 60px; }
    .word-row select { flex: 1.2; }

    /* Manage Slides List */
    #manage-list { display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto; padding-right: 5px;}
    .manage-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border-left: 6px solid #007bff;
    }
    .manage-info { display: flex; flex-direction: column; gap: 4px; }
    .manage-text { font-weight: bold; font-size: 16px; }
    .manage-meta { font-size: 12px; color: #aaa; }
    .manage-actions { display: flex; gap: 8px; }

    /* Buttons */
    button { cursor: pointer; border: none; font-weight: bold; transition: 0.2s; }
    .btn-action { border-radius: 6px; padding: 8px 12px; font-size: 13px; color: #fff; }
    .btn-show { background: #28a745; } .btn-show:hover { background: #218838; }
    .btn-edit { background: #ffc107; color: #000; } .btn-edit:hover { background: #e0a800; }
    .btn-delete { background: #dc3545; } .btn-delete:hover { background: #c82333; }
    
    .btn-add-word { background: #007bff; color: #fff; border-radius: 6px; padding: 8px 15px; margin-top: 10px; }
    .modal-buttons { display: flex; gap: 15px; margin-top: 25px; }
    .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; font-size: 16px; color: #fff; }
    .btn-save { background: #28a745; } .btn-save:hover { background: #218838; }
    .btn-cancel { background: #6c757d; } .btn-cancel:hover { background: #5a6268; }
    .btn-primary { background: #007bff; } .btn-primary:hover { background: #0056b3; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div id="modal-screen-selector" class="modal-overlay" style="display: flex;">
    <div class="modal-box" style="width: 400px;">
      <h3>📺 Connect to a Screen</h3>
      <p class="subtitle">Where is this billboard located?</p>
      
      <div class="form-group">
        <label>Select Existing Screen</label>
        <select id="screen-dropdown">
          <option value="">Loading screens...</option>
        </select>
      </div>

      <div class="form-group" style="text-align: center; color: #777;">— OR —</div>

      <div class="form-group">
        <label>Create New Screen</label>
        <input type="text" id="new-screen-input" placeholder="e.g. Madrid, Barcelona, Spawn Screen 1">
      </div>

      <div class="modal-buttons">
        <button class="btn-primary" onclick="initScreen()">Connect Display</button>
      </div>
    </div>
  </div>

  <div class="controls-panel">
    <div class="ctrl-btn" onclick="openAddModal()" title="Add New Slide">➕</div>
    <div class="ctrl-btn" onclick="openManageModal()" title="Manage Slides">⚙️</div>
  </div>
  
  <div class="top-right-panel">
    <div id="current-screen-badge" class="screen-badge">NO SCREEN</div>
    <button id="fullscreen-btn" class="ctrl-btn" onclick="toggleFullscreen()">⛶</button>
  </div>

  <div id="slide-container">
    <div id="slide-text" class="trans-fade">Waiting for screen connection...</div>
  </div>

  <div id="indicators"></div>
  <div id="progress-container"><div id="progress-bar"></div></div>

  <div id="modal-form" class="modal-overlay">
    <div class="modal-box">
      <h3 id="form-title">Create New Slide</h3>
      
      <div class="form-row">
        <div class="form-group">
          <label>Duration (Seconds)</label>
          <input type="number" id="input-duration" value="5" min="1">
        </div>
        <div class="form-group">
          <label>Transition Effect</label>
          <select id="input-transition">
            <option value="trans-fade">Fade In</option>
            <option value="trans-slide">Slide Up</option>
            <option value="trans-zoom">Zoom In</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Background Color</label>
        <input type="color" id="input-bg" value="#050505" style="height: 45px; cursor:pointer;">
      </div>

      <div class="form-group">
        <label>Words & Animations</label>
        <div id="words-builder"></div>
        <button type="button" class="btn-add-word" onclick="addWordRow()">+ Add Word</button>
      </div>

      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal('modal-form')">Cancel</button>
        <button class="btn-save" onclick="saveSlide()">Save to Screen</button>
      </div>
    </div>
  </div>

  <div id="modal-manage" class="modal-overlay">
    <div class="modal-box">
      <h3 id="manage-title">Manage Slides</h3>
      <div id="manage-list"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal('modal-manage')">Close</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAjeXycCBhYoAU-0iiC4LbSTylKrrThN8Y",
      authDomain: "sharplabubu.firebaseapp.com",
      databaseURL: "https://sharplabubu-default-rtdb.firebaseio.com",
      projectId: "sharplabubu",
      storageBucket: "sharplabubu.firebasestorage.app",
      messagingSenderId: "596148393481",
      appId: "1:596148393481:web:4f822d86c44a13bd810ad8",
      measurementId: "G-4M25R3BF08"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentScreenID = null;
    let slides = [];
    let currentIndex = 0;
    let slideTimer = null;
    let editingIndex = null;

    const container = document.getElementById('slide-container');
    const textElement = document.getElementById('slide-text');
    const progressBar = document.getElementById('progress-bar');
    const indicatorsBox = document.getElementById('indicators');

    // 1. Fetch available screens on load to populate the dropdown
    db.ref('screens').once('value', (snapshot) => {
      const dropdown = document.getElementById('screen-dropdown');
      dropdown.innerHTML = '<option value="">-- Choose a Screen --</option>';
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(screenName => {
          dropdown.innerHTML += `<option value="${screenName}">${screenName}</option>`;
        });
      }
    });

    // 2. Lock in the screen chosen by the user
    function initScreen() {
      const dropdownVal = document.getElementById('screen-dropdown').value;
      const newVal = document.getElementById('new-screen-input').value.trim();
      
      currentScreenID = newVal || dropdownVal;
      
      if (!currentScreenID) {
        alert("Bro, you gotta pick or type a screen name first!");
        return;
      }

      // Format string to be database safe (no crazy characters)
      currentScreenID = currentScreenID.replace(/[\.\#\$\[\]]/g, '');

      document.getElementById('modal-screen-selector').style.display = 'none';
      document.getElementById('current-screen-badge').textContent = '📺 ' + currentScreenID;
      document.getElementById('manage-title').textContent = `Manage: ${currentScreenID}`;

      // 3. Start listening only to THIS screen's data path
      listenToScreenSlides();
    }

    // 4. Firebase Listener specific to the selected screen
    function listenToScreenSlides() {
      db.ref(`screens/${currentScreenID}/slides`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          slides = Array.isArray(data) ? data : Object.values(data);
          if (currentIndex >= slides.length) currentIndex = 0;
          playSlide(currentIndex);
        } else {
          slides = [];
          textElement.innerHTML = `No slides for ${currentScreenID} yet. Click ➕ to create one.`;
          container.style.backgroundColor = "#050505";
          stopProgress();
        }
        buildIndicators();
      });
    }

    // Play Engine
    function playSlide(index) {
      if (!slides || slides.length === 0) return;
      clearTimeout(slideTimer);
      currentIndex = index;
      
      const slide = slides[currentIndex];
      const transitionClass = slide.transition || 'trans-fade';

      document.querySelectorAll('.dot').forEach((d, i) => {
        d.className = i === currentIndex ? 'dot active' : 'dot';
      });

      textElement.className = transitionClass;
      stopProgress();

      setTimeout(() => {
        container.style.backgroundColor = slide.backgroundColor || '#000000';
        textElement.innerHTML = '';

        if (slide.words && Array.isArray(slide.words)) {
          slide.words.forEach(w => {
            const span = document.createElement('span');
            span.className = `word ${w.animation || ''}`;
            span.textContent = w.text;
            span.style.color = w.color || '#ffffff';
            span.style.fontSize = (w.size || 6) + 'rem';
            textElement.appendChild(span);
          });
        }

        textElement.classList.add('active');
        
        const duration = (slide.duration || 5);
        startProgress(duration);

        slideTimer = setTimeout(() => {
          playSlide((currentIndex + 1) % slides.length);
        }, duration * 1000);

      }, 400); 
    }

    // Visual Progress Bar
    function startProgress(seconds) {
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';
      setTimeout(() => {
        progressBar.style.transition = `width ${seconds}s linear`;
        progressBar.style.width = '100%';
      }, 50);
    }
    function stopProgress() {
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';
    }

    function buildIndicators() {
      indicatorsBox.innerHTML = '';
      slides.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = i === currentIndex ? 'dot active' : 'dot';
        dot.onclick = () => playSlide(i);
        indicatorsBox.appendChild(dot);
      });
    }

    // Modal Control
    function openAddModal() {
      if(!currentScreenID) return alert("Select a screen first on load!");
      editingIndex = null;
      document.getElementById('form-title').textContent = "Create New Slide";
      document.getElementById('input-duration').value = 5;
      document.getElementById('input-transition').value = 'trans-fade';
      document.getElementById('input-bg').value = '#050505';
      document.getElementById('words-builder').innerHTML = '';
      addWordRow('New', '#ffffff', 8, 'pulse');
      addWordRow('Slide', '#007bff', 8, '');
      document.getElementById('modal-form').style.display = 'flex';
    }

    function openManageModal() {
      if(!currentScreenID) return;
      renderManageList();
      document.getElementById('modal-manage').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Word Builder System
    function addWordRow(text = '', color = '#ffffff', size = 6, animation = '') {
      const builder = document.getElementById('words-builder');
      const row = document.createElement('div');
      row.className = 'word-row';
      row.innerHTML = `
        <input type="text" class="w-text" placeholder="Word" value="${text}">
        <input type="color" class="w-color" value="${color}">
        <input type="number" class="w-size" value="${size}" title="Size">
        <select class="w-anim">
          <option value="" ${animation===''?'selected':''}>Normal</option>
          <option value="bounce" ${animation==='bounce'?'selected':''}>Bounce</option>
          <option value="glow" ${animation==='glow'?'selected':''}>Glow</option>
          <option value="pulse" ${animation==='pulse'?'selected':''}>Pulse</option>
          <option value="wave" ${animation==='wave'?'selected':''}>Wave</option>
          <option value="rainbow" ${animation==='rainbow'?'selected':''}>Rainbow</option>
        </select>
        <button type="button" class="btn-action btn-delete" onclick="this.parentElement.remove()">X</button>
      `;
      builder.appendChild(row);
    }

    // Save Data specifically to currentScreenID path
    function saveSlide() {
      const duration = parseInt(document.getElementById('input-duration').value) || 5;
      const transition = document.getElementById('input-transition').value;
      const backgroundColor = document.getElementById('input-bg').value;
      const rows = document.querySelectorAll('.word-row');
      const words = [];
      
      rows.forEach(row => {
        const text = row.querySelector('.w-text').value.trim();
        if (text) {
          words.push({
            text: text,
            color: row.querySelector('.w-color').value,
            size: parseFloat(row.querySelector('.w-size').value) || 6,
            animation: row.querySelector('.w-anim').value
          });
        }
      });

      if (words.length === 0) return alert("Add at least one word!");

      const slideData = { duration, transition, backgroundColor, words };

      if (editingIndex !== null) slides[editingIndex] = slideData;
      else slides.push(slideData);

      // Saves to the nested screen path
      db.ref(`screens/${currentScreenID}/slides`).set(slides).then(() => {
        closeModal('modal-form');
      });
    }

    // Manage List System
    function renderManageList() {
      const list = document.getElementById('manage-list');
      list.innerHTML = '';

      if (slides.length === 0) {
        list.innerHTML = '<div style="color:#aaa; text-align:center;">No slides saved for this screen.</div>';
        return;
      }

      slides.forEach((slide, index) => {
        let slideTitle = slide.words ? slide.words.map(w => w.text).join(' ') : 'Slide';
        const item = document.createElement('div');
        item.className = 'manage-item';
        item.style.borderLeftColor = slide.backgroundColor || '#007bff';
        item.innerHTML = `
          <div class="manage-info">
            <div class="manage-text">Slide ${index + 1}: ${slideTitle.substring(0, 20)}...</div>
            <div class="manage-meta">⏱️ ${slide.duration}s | 🎨 ${slide.words.length} Words</div>
          </div>
          <div class="manage-actions">
            <button class="btn-action btn-show" onclick="forcePlaySlide(${index})">▶ Play</button>
            <button class="btn-action btn-edit" onclick="loadEditSlide(${index})">✎ Edit</button>
            <button class="btn-action btn-delete" onclick="deleteSlide(${index})">🗑️</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function forcePlaySlide(index) {
      closeModal('modal-manage');
      playSlide(index);
    }

    function loadEditSlide(index) {
      const slide = slides[index];
      editingIndex = index;
      closeModal('modal-manage');
      
      document.getElementById('form-title').textContent = `Edit Slide ${index + 1}`;
      document.getElementById('input-duration').value = slide.duration || 5;
      document.getElementById('input-transition').value = slide.transition || 'trans-fade';
      document.getElementById('input-bg').value = slide.backgroundColor || '#000000';
      document.getElementById('words-builder').innerHTML = '';

      if (slide.words) {
        slide.words.forEach(w => addWordRow(w.text, w.color, w.size, w.animation));
      }
      document.getElementById('modal-form').style.display = 'flex';
    }

    function deleteSlide(index) {
      if (confirm("Delete Slide " + (index + 1) + " from " + currentScreenID + "?")) {
        slides.splice(index, 1);
        db.ref(`screens/${currentScreenID}/slides`).set(slides);
        renderManageList();
      }
    }

    // Fullscreen Support
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
