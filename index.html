<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billboard Slideshow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #slide-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      transition: background-color 0.5s ease;
    }
    #slide-text {
      line-height: 1.2;
      word-wrap: break-word;
      max-width: 90vw;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 0.3em;
      transition: opacity 0.3s ease;
    }

    /* Word Styling */
    .word {
      display: inline-block;
      transition: color 0.3s ease, font-size 0.3s ease;
    }
    
    /* Animations */
    .bounce { animation: bounce 0.8s infinite alternate; }
    .glow { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
    
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-15px); }
    }

    /* Subtle UI Buttons */
    .top-btn {
      position: fixed;
      top: 15px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .top-btn:hover {
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      border-color: #ffffff;
    }
    #add-btn {
      left: 15px;
      width: 36px;
      height: 36px;
      font-size: 22px;
      line-height: 30px;
      text-align: center;
    }
    #fullscreen-btn {
      right: 15px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
    }

    /* Modal Form Overlay */
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #1e1e1e;
      color: #ffffff;
      padding: 24px;
      border-radius: 10px;
      width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .modal-box h3 { margin-bottom: 16px; font-size: 18px; text-align: center; }
    
    /* Tabs */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .tab-btn { flex: 1; padding: 8px; background: #2a2a2a; border: none; color: #aaa; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .tab-btn.active { background: #007bff; color: #fff; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #aaa; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
    }

    /* Words Builder UI */
    #words-builder {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .word-row {
      display: flex;
      gap: 6px;
      align-items: center;
      background: #282828;
      padding: 6px;
      border-radius: 4px;
    }
    .word-row input[type="text"] { flex: 2; }
    .word-row input[type="color"] { width: 35px; height: 35px; padding: 0; cursor: pointer; }
    .word-row input[type="number"] { width: 55px; }
    .word-row select { flex: 1; }

    /* Manage List UI */
    #manage-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    .manage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #282828;
      padding: 10px;
      border-radius: 6px;
      border-left: 5px solid #007bff;
    }
    .manage-info { display: flex; flex-direction: column; gap: 2px; }
    .manage-text { font-weight: bold; font-size: 14px; color: #fff; }
    .manage-meta { font-size: 11px; color: #888; }
    .manage-actions { display: flex; gap: 6px; }

    .btn-action {
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }
    .btn-edit { background: #ffc107; color: #000; }
    .btn-delete { background: #dc3545; }
    .btn-add-word {
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .modal-buttons { display: flex; gap: 10px; margin-top: 18px; }
    .modal-buttons button {
      flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .btn-save { background: #28a745; color: #fff; }
    .btn-cancel { background: #6c757d; color: #fff; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <button id="add-btn" class="top-btn" onclick="openModal()">+</button>
  <button id="fullscreen-btn" class="top-btn" onclick="toggleFullscreen()">Fullscreen</button>

  <div id="slide-container">
    <div id="slide-text">Loading Firebase...</div>
  </div>

  <div id="modal-overlay">
    <div class="modal-box">
      
      <div class="tab-bar">
        <button id="tab-create-btn" class="tab-btn active" onclick="switchTab('create')">Create / Edit Slide</button>
        <button id="tab-manage-btn" class="tab-btn" onclick="switchTab('manage')">Manage All Slides</button>
      </div>

      <div id="tab-create">
        <h3 id="form-title">Add Custom Word Slide</h3>

        <div class="form-group">
          <label>Slide Duration (Seconds)</label>
          <input type="number" id="input-duration" value="5" min="1">
        </div>

        <div class="form-group">
          <label>Background Color</label>
          <input type="color" id="input-bg" value="#004d98">
        </div>

        <div class="form-group">
          <label>Customize Words</label>
          <div id="words-builder"></div>
          <button type="button" class="btn-add-word" onclick="addWordRow()">+ Add Another Word</button>
        </div>

        <div class="modal-buttons">
          <button class="btn-cancel" onclick="closeModal()">Close</button>
          <button class="btn-save" onclick="saveSlide()">Save Slide</button>
        </div>
      </div>

      <div id="tab-manage" style="display: none;">
        <h3>All Saved Slides</h3>
        <div id="manage-list"></div>
        <div class="modal-buttons">
          <button class="btn-cancel" onclick="closeModal()">Close</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAjeXycCBhYoAU-0iiC4LbSTylKrrThN8Y",
      authDomain: "sharplabubu.firebaseapp.com",
      databaseURL: "https://sharplabubu-default-rtdb.firebaseio.com",
      projectId: "sharplabubu",
      storageBucket: "sharplabubu.firebasestorage.app",
      messagingSenderId: "596148393481",
      appId: "1:596148393481:web:4f822d86c44a13bd810ad8",
      measurementId: "G-4M25R3BF08"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let slides = [];
    let currentIndex = 0;
    let slideTimer = null;
    let editingIndex = null; // Tracks if we are editing an existing slide

    const container = document.getElementById('slide-container');
    const textElement = document.getElementById('slide-text');

    // Realtime Database Listener
    db.ref('slides').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        slides = Array.isArray(data) ? data : Object.values(data);
        if (currentIndex >= slides.length) currentIndex = 0;
        showSlide();
      } else {
        slides = [];
        textElement.innerHTML = "No slides added yet. Click + to add one.";
        container.style.backgroundColor = "#000000";
        textElement.style.color = "#ffffff";
      }
      renderManageList();
    });

    function showSlide() {
      if (slideTimer) clearTimeout(slideTimer);
      if (!slides || slides.length === 0) return;

      const currentSlide = slides[currentIndex];
      textElement.style.opacity = 0;

      setTimeout(() => {
        container.style.backgroundColor = currentSlide.backgroundColor || '#000000';
        textElement.innerHTML = '';

        if (currentSlide.words && Array.isArray(currentSlide.words)) {
          currentSlide.words.forEach(w => {
            const span = document.createElement('span');
            span.className = `word ${w.animation || ''}`;
            span.textContent = w.text;
            span.style.color = w.color || '#ffffff';
            span.style.fontSize = (w.size || 6) + 'rem';
            textElement.appendChild(span);
          });
        } else {
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = currentSlide.text || '';
          span.style.color = currentSlide.textColor || '#ffffff';
          span.style.fontSize = currentSlide.fontSize || '6rem';
          textElement.appendChild(span);
        }

        textElement.style.opacity = 1;
      }, 300);

      const duration = (currentSlide.duration || 5) * 1000;

      slideTimer = setTimeout(() => {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide();
      }, duration);
    }

    // Modal & UI Functions
    function openModal() {
      resetForm();
      switchTab('create');
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
      resetForm();
    }

    function switchTab(tab) {
      if (tab === 'create') {
        document.getElementById('tab-create').style.display = 'block';
        document.getElementById('tab-manage').style.display = 'none';
        document.getElementById('tab-create-btn').className = 'tab-btn active';
        document.getElementById('tab-manage-btn').className = 'tab-btn';
      } else {
        document.getElementById('tab-create').style.display = 'none';
        document.getElementById('tab-manage').style.display = 'block';
        document.getElementById('tab-create-btn').className = 'tab-btn';
        document.getElementById('tab-manage-btn').className = 'tab-btn active';
      }
    }

    function resetForm() {
      editingIndex = null;
      document.getElementById('form-title').textContent = "Add Custom Word Slide";
      document.getElementById('input-duration').value = 5;
      document.getElementById('input-bg').value = '#004d98';
      document.getElementById('words-builder').innerHTML = '';
      addWordRow('Welcome to', '#edbb00', 6);
      addWordRow('Barcelona', '#ffffff', 8);
    }

    function addWordRow(text = '', color = '#ffffff', size = 6, animation = '') {
      const builder = document.getElementById('words-builder');
      const row = document.createElement('div');
      row.className = 'word-row';
      row.innerHTML = `
        <input type="text" class="w-text" placeholder="Word" value="${text}">
        <input type="color" class="w-color" value="${color}">
        <input type="number" class="w-size" value="${size}" title="Font Size">
        <select class="w-anim">
          <option value="" ${animation===''?'selected':''}>Static</option>
          <option value="bounce" ${animation==='bounce'?'selected':''}>Bounce</option>
          <option value="glow" ${animation==='glow'?'selected':''}>Glow</option>
        </select>
        <button type="button" class="btn-action btn-delete" onclick="this.parentElement.remove()">X</button>
      `;
      builder.appendChild(row);
    }

    function saveSlide() {
      const duration = parseInt(document.getElementById('input-duration').value) || 5;
      const backgroundColor = document.getElementById('input-bg').value;
      const rows = document.querySelectorAll('.word-row');

      const words = [];
      rows.forEach(row => {
        const text = row.querySelector('.w-text').value.trim();
        if (text) {
          words.push({
            text: text,
            color: row.querySelector('.w-color').value,
            size: parseFloat(row.querySelector('.w-size').value) || 6,
            animation: row.querySelector('.w-anim').value
          });
        }
      });

      if (words.length === 0) {
        alert("Please add at least one word!");
        return;
      }

      const slideData = { duration, backgroundColor, words };

      if (editingIndex !== null) {
        slides[editingIndex] = slideData;
      } else {
        slides.push(slideData);
      }

      db.ref('slides').set(slides).then(() => {
        closeModal();
      }).catch(err => {
        alert("Error saving: " + err.message);
      });
    }

    // Edit and Delete Logic
    function renderManageList() {
      const list = document.getElementById('manage-list');
      list.innerHTML = '';

      if (slides.length === 0) {
        list.innerHTML = '<div style="color:#aaa; text-align:center;">No slides available.</div>';
        return;
      }

      slides.forEach((slide, index) => {
        let slideTitle = '';
        if (slide.words && slide.words.length > 0) {
          slideTitle = slide.words.map(w => w.text).join(' ');
        } else {
          slideTitle = slide.text || 'Untitled Slide';
        }

        const item = document.createElement('div');
        item.className = 'manage-item';
        item.style.borderLeftColor = slide.backgroundColor || '#007bff';
        item.innerHTML = `
          <div class="manage-info">
            <div class="manage-text">${slideTitle}</div>
            <div class="manage-meta">Duration: ${slide.duration || 5}s</div>
          </div>
          <div class="manage-actions">
            <button class="btn-action btn-edit" onclick="loadEditSlide(${index})">Edit</button>
            <button class="btn-action btn-delete" onclick="deleteSlide(${index})">Delete</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function loadEditSlide(index) {
      const slide = slides[index];
      editingIndex = index;

      document.getElementById('form-title').textContent = `Edit Slide #${index + 1}`;
      document.getElementById('input-duration').value = slide.duration || 5;
      document.getElementById('input-bg').value = slide.backgroundColor || '#000000';
      document.getElementById('words-builder').innerHTML = '';

      if (slide.words && Array.isArray(slide.words)) {
        slide.words.forEach(w => addWordRow(w.text, w.color, w.size, w.animation));
      } else if (slide.text) {
        addWordRow(slide.text, slide.textColor || '#ffffff', parseInt(slide.fontSize) || 6);
      }

      switchTab('create');
    }

    function deleteSlide(index) {
      if (confirm("Are you sure you want to delete this slide?")) {
        slides.splice(index, 1);
        db.ref('slides').set(slides);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
