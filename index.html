<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billboard Slideshow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    #slide-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      transition: background-color 0.5s ease;
    }
    #slide-text {
      line-height: 1.2;
      word-wrap: break-word;
      max-width: 90vw;
      transition: opacity 0.3s ease, color 0.5s ease;
    }
    #fullscreen-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s ease;
    }
    #fullscreen-btn:hover {
      opacity: 1;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <button id="fullscreen-btn" onclick="toggleFullscreen()">Fullscreen</button>

  <div id="slide-container">
    <h1 id="slide-text">Loading Firebase...</h1>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAjeXycCBhYoAU-0iiC4LbSTylKrrThN8Y",
      authDomain: "sharplabubu.firebaseapp.com",
      databaseURL: "https://sharplabubu-default-rtdb.firebaseio.com",
      projectId: "sharplabubu",
      storageBucket: "sharplabubu.firebasestorage.app",
      messagingSenderId: "596148393481",
      appId: "1:596148393481:web:4f822d86c44a13bd810ad8",
      measurementId: "G-4M25R3BF08"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let slides = [];
    let currentIndex = 0;
    let slideTimer = null;

    const container = document.getElementById('slide-container');
    const textElement = document.getElementById('slide-text');

    // Realtime Database Listener
    db.ref('slides').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        slides = Array.isArray(data) ? data : Object.values(data);
        currentIndex = 0;
        showSlide();
      } else {
        textElement.textContent = "No slides found in database.";
        container.style.backgroundColor = "#000000";
        textElement.style.color = "#ffffff";
      }
    });

    function showSlide() {
      if (slideTimer) clearTimeout(slideTimer);
      if (!slides || slides.length === 0) return;

      const currentSlide = slides[currentIndex];

      textElement.style.opacity = 0;

      setTimeout(() => {
        textElement.textContent = currentSlide.text || '';
        container.style.backgroundColor = currentSlide.backgroundColor || '#000000';
        textElement.style.color = currentSlide.textColor || '#ffffff';
        textElement.style.fontSize = currentSlide.fontSize || '6rem';
        textElement.style.opacity = 1;
      }, 300);

      const duration = (currentSlide.duration || 5) * 1000;

      slideTimer = setTimeout(() => {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide();
      }, duration);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
